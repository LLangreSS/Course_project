services:
  db:
    image: paradedb/paradedb:latest
    container_name: knowledge_db
    restart: always
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d knowledge_guard" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:


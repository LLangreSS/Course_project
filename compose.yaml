services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - ./hugg:/app/hugg
      - ./bert:/app/bert
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: ankane/pgvector:latest
    container_name: knowledge_db
    restart: always
    # Replace env_file with explicit environment variables
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=knowledge_guard
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d knowledge_guard" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: